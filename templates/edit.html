<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit entry · Smart Journal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header class="hero">
            <div class="topbar">
                <div>
                    <p class="eyebrow">Refine your thoughts</p>
                    <h1>Edit entry</h1>
                    <p class="subtitle">Update the details, then save.</p>
                </div>

                <a class="button button-secondary" href="{{ url_for('manage_categories') }}">
                    Manage categories
                </a>
            </div>
        </header>

        <section class="card">
            <form method="post">
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    maxlength="120"
                    value="{{ entry['title'] }}"
                    required
                >

                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0"
                    step="0.01"
                    value="{{ entry['amount'] if entry['amount'] is not none else '' }}"
                    placeholder="e.g. 88.00"
                >

                <label for="category_id">Category</label>
                <select id="category_id" name="category_id">
                    <option value="">No category</option>
                    {% for category in categories %}
                        <option
                            value="{{ category['id'] }}"
                            {% if entry['category_id'] == category['id'] %}
                                selected
                            {% endif %}
                        >
                            {{ category['name'] }}
                        </option>
                    {% endfor %}
                </select>

                <label for="content">Entry</label>
                <textarea
                    id="content"
                    name="content"
                    rows="12"
                    required
                >{{ entry["content"] }}</textarea>

                <div class="form-actions">
                    <button type="submit">Save changes</button>
                    <a class="button button-secondary" href="{{ url_for('index') }}">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
